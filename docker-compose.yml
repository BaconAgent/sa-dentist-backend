services:
  rabbitmq:
    image: rabbitmq:4.0.7-management
    container_name: rabbitmq
    hostname: rabbitmq
    networks:
    - Asda-network
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:15
    container_name: postgres_appointmentsdb
    networks:
    - Asda-network
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: AsdaAsda
      POSTGRES_DB: appointments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  user-service:
    image: "baconagent/user-service"
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    networks:
      - Asda-network
    depends_on:
       rabbitmq:
         condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8082:8082"
 
  clinic-service:
    image: "baconagent/clinic-service"
    build:
      context: .
      dockerfile: clinic-service/Dockerfile
    container_name: clinic-service
    networks:
      - Asda-network
    depends_on:
       rabbitmq:
         condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8080:8080"

  appointment-service:
    image: "baconagent/appointment-service"
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    container_name: appointment-service
    networks:
      - Asda-network
    depends_on:
       rabbitmq:
         condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8081:8081"

  api-gateway:
    image: "baconagent/api-gateway"
    build:
      context: ./API-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    networks:
      - Asda-network
    depends_on:
       rabbitmq:
         condition: service_healthy
    ports:
      - "9000:9000"
  loki:
    image: grafana/loki:main
    command: ['-config.file=/etc/loki/local-config.yaml']
    networks:
      - Asda-network
    ports:
      - '3100:3100'

  prometheus:
    image: prom/prometheus:v2.46.0
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - Asda-network
    ports:
      - '9090:9090'
  tempo:
    image: grafana/tempo:2.2.2
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - ./docker/tempo/tempo-data:/tmp/tempo
    networks:
      - Asda-network
    ports:
      - '3110:3100' # Tempo
      - '9411:9411' # zipkin

  grafana:
    image: grafana/grafana:10.1.0
    volumes:
      - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    networks:
      - Asda-network
    ports:
      - '3000:3000'

volumes:
  postgres_data:

networks:
  Asda-network:
    driver: bridge