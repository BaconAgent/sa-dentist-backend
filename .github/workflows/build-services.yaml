name: Build Changed Service

on:
  push:
    branches: [dev]

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository so we can inspect the changes
      - name: Checkout code
        uses: actions/checkout@v4
      # Set up JDK 23
      - name: Set up JDK 23
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '23'
          
      # Use dorny/paths-filter to detect changes in specific directories
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            appointment-service:
              - 'appointment-service/**'
            clinic-service:
              - 'clinic-service/**'
            user-service:
              - 'user-service/**'
            API-gateway:
              - 'API-gateway/**'

      # Build Microservice 1 if there are changes
      - name: Build appointment service
        if: steps.filter.outputs.appointment-service == 'true'
        working-directory: appointment-service
        run: mvn clean install

      # Build Microservice 2 if there are changes
      - name: Build clinic service
        if: steps.filter.outputs.clinic-service == 'true'
        working-directory: clinic-service
        run: mvn clean install

      # Build Microservice 3 if there are changes
      - name: Build user service
        if: steps.filter.outputs.user-service == 'true'
        working-directory: user-service
        run: mvn clean install

      # Build API Gateway if there are changes
      - name: Build API Gateway
        if: steps.filter.outputs.API-gateway == 'true'
        working-directory: API-gateway
        run: mvn clean install

      - name: Docker compose build
        run: |
            docker compose build
            mkdir dockerimages
            docker save baconagent/appointment-service -o ./dockerimages/appointment-service.tar
            docker save baconagent/clinic-service -o ./dockerimages/clinic-service.tar
            docker save baconagent/api-gateway -o ./dockerimages/api-gateway.tar

      - name: Upload Docker images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: ./dockerimages/

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
        name: Checkout docker compose file
        with:
          sparse-checkout: |
            docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Create docker images folder
        run: |
          docker images
          mkdir dockerimages

      - name: Download Docker images artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: ./dockerimages/

      - name: Load Docker Images
        run: |
          docker load -i ./dockerimages/appointment-service.tar
          docker load -i ./dockerimages/clinic-service.tar
          docker load -i ./dockerimages/api-gateway.tar
          docker images

      - name: Run Docker Containers
        run: |
          docker compose up -d
          docker ps
      - name : Test RabbitMQ request
        run: |
          sleep 10s
          curl -u guest:guest \
             -H "Content-Type: application/json" \
             -X PUT \
             -d '{"auto_delete": false, "durable": true, "arguments": {}}' \
             http://localhost:15672/api/queues/%2f/delete_clinic_queue
          sleep 10s
          curl 'http://localhost:8080/api/clinic/publish?message=test'
      - name: Validate Docker logs
        run: |
          docker compose --profile all logs appointment-service > appointment-service.txt
          if grep -q "test" appointment-service.txt; then
            echo "Log entry containing test message found!"
          else
            echo "Log entry containing test message not found!"
            docker compose logs
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - test

    steps:
      # Checkout repository so we can detect changes and build images.
      - name: Checkout code
        uses: actions/checkout@v3

      # Use dorny/paths-filter to detect which service directories have changes.
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            appointment-service:
              - 'appointment-service/**'
            clinic-service:
              - 'clinic-service/**'
            user-service:
              - 'user-service/**'
            API-gateway:
              - 'API-gateway/**'

      # Set up Docker Buildx.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to Docker Hub using secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build and push Microservice1 image only if changes were detected.
      - name: Build and push Appointment service
        if: steps.filter.outputs.appointment-service == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./appointment-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/appointment-service:latest

      # Build and push Microservice2 image only if changes were detected.
      - name: Build and push Clinic service
        if: steps.filter.outputs.clinic-service == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./clinic-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clinic-service:latest

      # Build and push Microservice3 image only if changes were detected.
      - name: Build and push User service
        if: steps.filter.outputs.user-service == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./microservice3
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest

      # Build and push API Gateway image only if changes were detected.
      - name: Build and push API Gateway
        if: steps.filter.outputs.API-gateway == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./API-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest

  cleanup:
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: ${{ always() }}

    steps:
      - uses: geekyeggo/delete-artifact@v5
        name: Cleanup artifacts
        with:
          name: |
            docker-images
