apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.46.0
          ports:
            - containerPort: 9090
          args:
            - --enable-feature=exemplar-storage
            - --config.file=/etc/prometheus/prometheus.yml
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['prometheus:9090']

    - job_name: 'clinic-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
        - targets: ['clinic-service:8080']
          labels:
            application: 'Clinic Service'

    - job_name: 'appointment-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
        - targets: ['appointment-service:8081']
          labels:
            application: 'Appointment Service'

    - job_name: 'user-service'
      metrics_path: '/actuator/prometheus'
      static_configs:
        - targets: ['user-service:8082']
          labels:
            application: 'User Service'

    - job_name: 'api-gateway'
      metrics_path: '/actuator/prometheus'
      static_configs:
        - targets: ['api-gateway:9000']
          labels:
            application: 'API Gateway'
